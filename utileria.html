<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utilería para imprimir</title>
<meta name="description" content="Imágenes para imprimir del show de payasas ¡Corre, pero con paciencia! — Día de la Biblia, Iglesia Gosén.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: una sola pantalla — carpa arriba, escenario con la imagen al centro, ficha con cantidad y botones abajo, tira de miniaturas */
:root{
  color-scheme: light;
  --paper:#fffaf2; --ink:#2d2340; --muted:#6f6483; --line:#efe3d2;
  --red:#ff6b6b; --orange:#ff8a3d; --teal:#1fb5a8; --yellow:#ffc93c; --purple:#9b7bff;
  --orange-soft:#ffe6d3; --teal-soft:#d4f5f1; --yellow-soft:#fff3c8; --purple-soft:#ece6ff;
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button,a{font:inherit;color:inherit}

.app{height:100vh;height:100dvh;max-width:1180px;margin:0 auto;display:grid;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "info" "thumbs";gap:10px;
  padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 12px)}

.stripes{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 8px);background:repeating-linear-gradient(90deg,var(--red) 0 26px,#fff4e6 26px 52px);z-index:2}
.top{grid-area:top;display:flex;align-items:flex-end;gap:12px;min-width:0}
.top .ttl{min-width:0;flex:1}
.eyebrow{margin:0;font-weight:900;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(1.45rem,6.4vw,2.1rem);line-height:1;color:var(--red);text-shadow:2px 2px 0 var(--yellow)}
.badge{flex:none;text-align:right;font-weight:900;font-size:.72rem;line-height:1.25;border:2px solid var(--ink);border-radius:14px;padding:4px 10px;background:var(--yellow-soft)}

.stage{grid-area:stage;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:22px;border:3px solid var(--ink);
  background:radial-gradient(circle at 1px 1px,rgba(45,35,64,.12) 1.5px,transparent 2px) 0 0/18px 18px,var(--teal-soft);box-shadow:4px 4px 0 var(--ink);padding:14px 52px;touch-action:pan-y}
.holder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
#view{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px;box-shadow:0 0 0 3px var(--ink),5px 6px 0 3px rgba(45,35,64,.35);background:#fff;transition:opacity .15s}
#view.fade{opacity:.3}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.arrow svg{width:18px;height:18px}
.arrow.prev{left:8px}.arrow.next{right:8px}
.arrow:active{transform:translateY(-50%) scale(.92)}

.info{grid-area:info;display:flex;flex-direction:column;gap:8px;min-width:0}
.namerow{display:flex;align-items:baseline;gap:10px;min-width:0}
.idx{flex:none;font-family:var(--display);font-size:1.05rem;color:var(--orange);font-variant-numeric:tabular-nums}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-weight:900;font-size:.72rem;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;background:var(--purple-soft)}
.qty{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:.8rem;border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 3px;background:var(--orange-soft)}
.qty b{display:grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;font-family:var(--display);font-weight:400;font-size:.85rem;padding:0 5px}
.qty.two{background:var(--yellow)}
.qty.two b{background:var(--ink)}
.how{margin:0;font-weight:700;font-size:.9rem;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.actions{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:.95rem;border:3px solid var(--ink);border-radius:16px;padding:11px 12px;cursor:pointer;background:#fff;box-shadow:3px 3px 0 var(--ink);text-decoration:none;text-align:center;line-height:1.15}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--orange);color:#fff;flex:1.4}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.7;cursor:progress}
.btn:focus-visible,.arrow:focus-visible,.thumb:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

.thumbs{grid-area:thumbs;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px 2px 6px 8px;scrollbar-width:none;min-width:0}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;position:relative;height:66px;padding:3px;border:2.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;display:grid;place-items:center}
.thumb img{display:block;height:54px;width:auto;max-width:150px;object-fit:contain;border-radius:4px}
.thumb.on{border-color:var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.thumb .n{position:absolute;top:-7px;left:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:.68rem;font-weight:900;display:grid;place-items:center;padding:0 5px}
.thumb .x{position:absolute;bottom:-6px;right:-6px;height:20px;border-radius:10px;background:var(--orange);color:#fff;border:2px solid var(--ink);font-size:.66rem;font-weight:900;display:grid;place-items:center;padding:0 6px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--ink);color:#fff;font-weight:800;font-size:.9rem;padding:10px 16px;border-radius:999px;transition:transform .25s;z-index:5;white-space:nowrap}
.toast.show{transform:translate(-50%,0);visibility:visible}

@media (min-width:900px) and (min-height:560px){
  .app{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "stage info" "stage thumbs";column-gap:20px}
  .stage{padding:22px 64px}
  .arrow{width:46px;height:46px}
  .info{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
  h2{white-space:normal;font-size:1.4rem}
  .how{-webkit-line-clamp:4;min-height:0}
  .actions{flex-direction:column}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);align-content:start;overflow-y:auto;overflow-x:hidden;padding:10px 6px}
  .thumb{height:auto;aspect-ratio:1.25}
  .thumb img{height:auto;max-height:72px;max-width:100%}
}
@media (max-height:620px) and (max-width:899px){
  .how{display:none}
  .thumb{height:54px}.thumb img{height:42px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stripes" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="ttl">
      <p class="eyebrow">¡Corre, pero con paciencia! · Día de la Biblia</p>
      <h1>Utilería para imprimir</h1>
    </div>
    <span class="badge" id="badge">11 imágenes<br>13 copias</span>
  </header>

  <section class="stage" id="stage" aria-label="Vista previa">
    <button class="arrow prev" id="prev" aria-label="Imagen anterior"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 6 10l7 7"/></svg></button>
    <div class="holder"><img id="view" alt=""></div>
    <button class="arrow next" id="next" aria-label="Imagen siguiente"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 3 7 7-7 7"/></svg></button>
  </section>

  <section class="info" aria-live="polite">
    <div class="namerow"><span class="idx" id="idx">01</span><h2 id="name">Cartel META</h2></div>
    <div class="chips"><span class="qty" id="qty"><b id="qtyn">1</b><span id="qtyt">copia</span></span><span class="chip" id="scene">Escena</span></div>
    <p class="how" id="how"></p>
    <div class="actions">
      <a class="btn primary" id="dl" href="#" download><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10m-4.5-4.5L10 13l4.5-4.5M4 17h12"/></svg><span>Descargar imagen</span></a>
      <button class="btn" id="dlall" type="button"><span>Descargar todas</span></button>
    </div>
  </section>

  <nav class="thumbs" id="thumbs" aria-label="Todas las imágenes"></nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* Para cambiar una imagen, reemplaza el archivo en la carpeta "imagenes" con el mismo nombre. */
const ITEMS=[
 {name:'Cartel META (frente)',file:'01-cartel-meta.png',qty:1,scene:'Escenas 4 y 12',how:'Imprímelo junto con el cartel CIELO y pégalos espalda con espalda sobre cartón. Ponle un palo para que Leiry pueda moverlo.'},
 {name:'Cartel CIELO (reverso)',file:'02-cartel-cielo.png',qty:1,scene:'Escena 12',how:'Va detrás del cartel META. Leiry lo voltea durante el mensaje final.'},
 {name:'Obstáculo: MIEDO',file:'03-miedo.png',qty:1,scene:'Escena 7',how:'Pégalo en la primera de las tres cajas de cartón.'},
 {name:'Obstáculo: TRISTEZA',file:'04-tristeza.png',qty:1,scene:'Escena 7',how:'Pégalo en la segunda caja de cartón.'},
 {name:'Obstáculo: ¡LO QUIERO YA!',file:'05-lo-quiero-ya.png',qty:1,scene:'Escena 7',how:'Pégalo en la tercera caja. Es el obstáculo más difícil.'},
 {name:'Reglas para la carrera',file:'06-reglas-para-la-carrera.png',qty:2,scene:'Escena 2',how:'Una copia para cada payasa, con el orden de las 13 escenas del show.'},
 {name:'Reloj gigante',file:'07-reloj.png',qty:1,scene:'Escena 2',how:'Pégalo sobre cartón y recórtalo por el borde para el examen de paciencia.'},
 {name:'Microondas',file:'08-microondas.jpg',qty:1,scene:'Escena 5',how:'Pégalo al frente de una caja y deja una abertura atrás para meter y sacar las tortas.'},
 {name:'Torta cruda',file:'09-torta-cruda.jpg',qty:1,scene:'Escena 5',how:'Pégala sobre cartón. Es la que Amanda saca antes de tiempo.'},
 {name:'Torta lista',file:'10-torta-lista.jpg',qty:1,scene:'Escena 5',how:'Pégala sobre cartón. Es la que sale cuando los niños cuentan hasta diez.'},
 {name:'Medalla La carrera de la Fe',file:'11-medalla.jpg',qty:2,scene:'Escena 9',how:'Una para cada voluntario de la carrera de la cuchara. Recórtalas y pégales una cinta para colgarlas.'}
];
const DIR='imagenes/',MINI='imagenes/mini/';
const mini=f=>MINI+f.replace(/\.(png|jpg)$/,'.jpg');

const $=id=>document.getElementById(id);
const view=$('view'),thumbs=$('thumbs');
let cur=0;try{const s=+localStorage.getItem('imp-cur2');if(s>=0&&s<ITEMS.length)cur=s}catch(e){}

const total=ITEMS.reduce((a,b)=>a+b.qty,0);
$('badge').innerHTML=`${ITEMS.length} imágenes<br>${total} copias`;

ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='thumb';
  b.setAttribute('aria-label',`${i+1}. ${it.name}, ${it.qty} ${it.qty>1?'copias':'copia'}`);
  b.innerHTML=`<span class="n">${i+1}</span><img src="${mini(it.file)}" alt="" loading="lazy">${it.qty>1?`<span class="x">×${it.qty}</span>`:''}`;
  b.onclick=()=>select(i);thumbs.appendChild(b)});

function select(i){cur=(i+ITEMS.length)%ITEMS.length;try{localStorage.setItem('imp-cur2',cur)}catch(e){}const it=ITEMS[cur];
  $('idx').textContent=String(cur+1).padStart(2,'0');$('name').textContent=it.name;$('scene').textContent=it.scene;$('how').textContent=it.how;
  $('qtyn').textContent=it.qty;$('qtyt').textContent=it.qty>1?'copias':'copia';$('qty').classList.toggle('two',it.qty>1);
  const dl=$('dl');dl.href=DIR+it.file;dl.setAttribute('download',it.file);
  view.classList.add('fade');const im=new Image();im.onload=im.onerror=()=>{view.src=im.src;view.alt=it.name;view.classList.remove('fade')};im.src=DIR+it.file;
  [...thumbs.children].forEach((t,j)=>{t.classList.toggle('on',j===cur);t.setAttribute('aria-current',j===cur?'true':'false')});
  thumbs.children[cur].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}

function toast(msg,ms=2400){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function save(it){const a=document.createElement('a');a.href=DIR+it.file;a.download=it.file;document.body.appendChild(a);a.click();a.remove()}

$('dl').addEventListener('click',()=>toast(`Descargando: ${ITEMS[cur].name}`));
$('dlall').onclick=async()=>{const btn=$('dlall'),sp=btn.querySelector('span');btn.disabled=true;
  for(let i=0;i<ITEMS.length;i++){sp.textContent=`Descargando ${i+1} de ${ITEMS.length}…`;save(ITEMS[i]);await wait(800)}
  sp.textContent='Descargar todas';btn.disabled=false;toast(`Listo: se descargaron las ${ITEMS.length} imágenes`)};

$('prev').onclick=()=>select(cur-1);$('next').onclick=()=>select(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')select(cur-1);if(e.key==='ArrowRight')select(cur+1)});
let sx=null;$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)select(cur+(dx<0?1:-1));sx=null});
select(cur);
</script>
</body>
</html>
